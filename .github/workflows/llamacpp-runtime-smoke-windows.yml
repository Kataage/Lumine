name: llamacpp-runtime-smoke-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - "internal/ai/llamacpp/**"
      - "internal/commands/llama_runtime_shared.go"
      - ".github/workflows/llamacpp-runtime-smoke-windows.yml"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Run pinned CPU and Vulkan runtime smoke
        run: go test ./internal/ai/llamacpp -run TestRealPinnedLlamaRuntimeSmoke -count=1 -v
        env:
          LUMINE_LLAMA_RUNTIME_REAL_SMOKE: "1"
