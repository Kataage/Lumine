name: greenfield-core

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

concurrency:
  group: greenfield-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-policy:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require develop as release source
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Release PRs to master must come from develop; got '$HEAD_REF'." >&2
            exit 1
          fi

  release-tree-consistency:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify master matches develop
        shell: bash
        run: |
          git fetch origin develop --depth=1
          master_tree="$(git rev-parse 'HEAD^{tree}')"
          develop_tree="$(git rev-parse 'origin/develop^{tree}')"

          if [ "$master_tree" != "$develop_tree" ]; then
            echo "master must be a release promotion of the current develop tree." >&2
            echo "master tree:  $master_tree" >&2
            echo "develop tree: $develop_tree" >&2
            exit 1
          fi

  windows-core:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LUMINE_REVISION: ${{ github.sha }}
      LUMINE_HARDWARE_ID: github-windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore Lumine.sln

      - name: Verify architecture boundaries
        shell: pwsh
        run: ./build/Verify-Architecture.ps1

      - name: Build release
        run: dotnet build Lumine.sln -c Release --no-restore

      - name: Foundation runtime smoke test
        run: dotnet run --project tests/Lumine.Foundation.Smoke/Lumine.Foundation.Smoke.csproj -c Release --no-build

      - name: Diagnostics smoke test
        run: dotnet run --project tests/Lumine.Diagnostics.Smoke/Lumine.Diagnostics.Smoke.csproj -c Release --no-build

      - name: Library Core smoke test
        run: dotnet run --project tests/Lumine.Library.Smoke/Lumine.Library.Smoke.csproj -c Release --no-build

      - name: Image Core smoke test
        run: dotnet run --project tests/Lumine.Image.Smoke/Lumine.Image.Smoke.csproj -c Release --no-build

      - name: App Detail adapter smoke test
        run: dotnet run --project tests/Lumine.App.Smoke/Lumine.App.Smoke.csproj -c Release --no-build

      - name: Windows filesystem sync smoke test
        run: dotnet run --project tests/Lumine.Filesystem.Smoke/Lumine.Filesystem.Smoke.csproj -c Release --no-build

      - name: Generate filesystem sync benchmark
        run: dotnet run --project tools/Lumine.Filesystem.Benchmarks/Lumine.Filesystem.Benchmarks.csproj -c Release --no-build -- --count 128 --output artifacts/benchmarks/filesystem-sync.json

      - name: Enforce filesystem performance acceptance
        shell: pwsh
        run: ./build/Test-FilesystemPerformance.ps1

      - name: Generate Detail full-resolution benchmark
        run: dotnet run --project tools/Lumine.Detail.Benchmarks/Lumine.Detail.Benchmarks.csproj -c Release --no-build -- --output artifacts/benchmarks/detail-full-resolution.json

      - name: Enforce Detail full-resolution performance acceptance
        shell: pwsh
        run: ./build/Test-DetailPerformance.ps1

      - name: Generate full-resolution access-policy benchmark
        run: dotnet run --project tools/Lumine.FullResolution.Benchmarks/Lumine.FullResolution.Benchmarks.csproj -c Release --no-build -- --output artifacts/benchmarks/full-resolution-access-policy.json

      - name: Enforce full-resolution access-policy benchmark
        shell: pwsh
        run: ./build/Test-FullResolutionAccessPolicy.ps1

      - name: Viewer virtualization smoke test
        run: dotnet run --project tests/Lumine.Viewer.Smoke/Lumine.Viewer.Smoke.csproj -c Release --no-build

      - name: Generate Viewer Core benchmarks
        shell: pwsh
        run: |
          foreach ($count in 10000, 50000, 100000) {
            dotnet run --project tools/Lumine.Viewer.Benchmarks/Lumine.Viewer.Benchmarks.csproj -c Release --no-build -- --count $count --output "artifacts/benchmarks/viewer-$count.json"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Enforce Viewer performance acceptance
        shell: pwsh
        run: ./build/Test-ViewerPerformance.ps1

      - name: Generate 100k Core baseline result
        run: dotnet run --project tools/Lumine.Benchmarks/Lumine.Benchmarks.csproj -c Release --no-build -- --count 100000 --output artifacts/benchmarks/core-100000.json

      - name: Generate Library Core benchmarks
        shell: pwsh
        run: |
          # Keep a cold 100k sample so the acceptance gate cannot be satisfied
          # only because smaller runs warmed SQLite / filesystem caches first.
          dotnet run --project tools/Lumine.Library.Benchmarks/Lumine.Library.Benchmarks.csproj -c Release --no-build -- --count 100000 --output "artifacts/benchmarks/library-100000-cold.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          foreach ($count in 10000, 50000, 100000) {
            dotnet run --project tools/Lumine.Library.Benchmarks/Lumine.Library.Benchmarks.csproj -c Release --no-build -- --count $count --output "artifacts/benchmarks/library-$count.json"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Enforce Library performance acceptance
        shell: pwsh
        run: ./build/Test-LibraryPerformance.ps1

      - name: Generate Image Core benchmark
        run: dotnet run --project tools/Lumine.Image.Benchmarks/Lumine.Image.Benchmarks.csproj -c Release --no-build -- --count 64 --output artifacts/benchmarks/image-thumbnail.json

      - name: Enforce Image performance acceptance
        shell: pwsh
        run: ./build/Test-ImagePerformance.ps1

      - name: Upload Core benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: lumine-core-baselines-${{ github.run_id }}
          path: artifacts/benchmarks/*.json
          if-no-files-found: error

      - name: Publish NativeAOT
        run: dotnet publish src/Lumine.App/Lumine.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/native-aot

      - name: Verify NativeAOT executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/native-aot/Lumine.App.exe"
          if (-not (Test-Path $exe)) {
            throw "NativeAOT executable was not produced: $exe"
          }
          $item = Get-Item $exe
          Write-Host "NativeAOT executable: $($item.FullName) ($($item.Length) bytes)"

      - name: Publish NativeAOT Image runtime smoke
        run: dotnet publish tests/Lumine.Image.NativeAot.Smoke/Lumine.Image.NativeAot.Smoke.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/native-aot-image-smoke

      - name: Run NativeAOT Image runtime smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/native-aot-image-smoke/Lumine.Image.NativeAot.Smoke.exe"
          if (-not (Test-Path $exe)) {
            throw "NativeAOT Image smoke executable was not produced: $exe"
          }
          & $exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
