name: v2-foundation

on:
  push:
    branches:
      - v2
      - 'v2-*'
  pull_request:
    branches:
      - v2

permissions:
  contents: read

jobs:
  windows-foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LUMINE_REVISION: ${{ github.sha }}
      LUMINE_HARDWARE_ID: github-windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore Lumine.sln

      - name: Verify architecture boundaries
        shell: pwsh
        run: ./build/Verify-Architecture.ps1

      - name: Build release
        run: dotnet build Lumine.sln -c Release --no-restore

      - name: Foundation runtime smoke test
        run: dotnet run --project tests/Lumine.Foundation.Smoke/Lumine.Foundation.Smoke.csproj -c Release --no-build

      - name: Diagnostics smoke test
        run: dotnet run --project tests/Lumine.Diagnostics.Smoke/Lumine.Diagnostics.Smoke.csproj -c Release --no-build

      - name: Generate 100k Core baseline result
        run: dotnet run --project tools/Lumine.Benchmarks/Lumine.Benchmarks.csproj -c Release --no-build -- --count 100000 --output artifacts/benchmarks/core-100000.json

      - name: Upload Core baseline result
        uses: actions/upload-artifact@v4
        with:
          name: lumine-v2-core-baseline-${{ github.run_id }}
          path: artifacts/benchmarks/core-100000.json
          if-no-files-found: error

      - name: Publish NativeAOT
        run: dotnet publish src/Lumine.App/Lumine.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/native-aot

      - name: Verify NativeAOT executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/native-aot/Lumine.App.exe"
          if (-not (Test-Path $exe)) {
            throw "NativeAOT executable was not produced: $exe"
          }
          $item = Get-Item $exe
          Write-Host "NativeAOT executable: $($item.FullName) ($($item.Length) bytes)"
