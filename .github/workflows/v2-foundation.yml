name: greenfield-core

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

concurrency:
  group: greenfield-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-policy:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require develop as release source
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Release PRs to master must come from develop; got '$HEAD_REF'." >&2
            exit 1
          fi

  release-tree-consistency:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify master matches develop
        shell: bash
        run: |
          git fetch origin develop --depth=1
          master_tree="$(git rev-parse 'HEAD^{tree}')"
          develop_tree="$(git rev-parse 'origin/develop^{tree}')"

          if [ "$master_tree" != "$develop_tree" ]; then
            echo "master must be a release promotion of the current develop tree." >&2
            echo "master tree:  $master_tree" >&2
            echo "develop tree: $develop_tree" >&2
            exit 1
          fi

  windows-core:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LUMINE_REVISION: ${{ github.sha }}
      LUMINE_HARDWARE_ID: github-windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore Lumine.sln

      - name: Verify architecture boundaries
        shell: pwsh
        run: ./build/Verify-Architecture.ps1

      - name: Validate real-library acceptance wrapper syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "./build/Run-RealLibraryAcceptance.ps1",
            "./build/Run-ProductAcceptance.ps1",
            "./build/Compare-ThumbnailStoragePolicies.ps1",
            "./build/Test-RealLibraryAcceptanceWrapper.ps1",
            "./build/Sanitize-AcceptancePackage.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors) | Out-Null

            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }

      - name: Validate real-library acceptance wrapper syntax on Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($script in @(
            "./build/Run-RealLibraryAcceptance.ps1",
            "./build/Run-ProductAcceptance.ps1",
            "./build/Compare-ThumbnailStoragePolicies.ps1",
            "./build/Test-RealLibraryAcceptanceWrapper.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors) | Out-Null

            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }

      - name: Build release
        run: dotnet build Lumine.sln -c Release --no-restore

      - name: Foundation runtime smoke test
        run: dotnet run --project tests/Lumine.Foundation.Smoke/Lumine.Foundation.Smoke.csproj -c Release --no-build

      - name: Diagnostics smoke test
        run: dotnet run --project tests/Lumine.Diagnostics.Smoke/Lumine.Diagnostics.Smoke.csproj -c Release --no-build

      - name: Library Core smoke test
        run: dotnet run --project tests/Lumine.Library.Smoke/Lumine.Library.Smoke.csproj -c Release --no-build

      - name: Image Core smoke test
        run: dotnet run --project tests/Lumine.Image.Smoke/Lumine.Image.Smoke.csproj -c Release --no-build

      - name: App Detail adapter smoke test
        run: dotnet run --project tests/Lumine.App.Smoke/Lumine.App.Smoke.csproj -c Release --no-build -- --visual-output=artifacts/visual-regression

      - name: Upload UI visual regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumine-ui-visual-evidence-${{ github.run_id }}
          path: artifacts/visual-regression/**
          if-no-files-found: warn
          retention-days: 14

      - name: Windows filesystem sync smoke test
        run: dotnet run --project tests/Lumine.Filesystem.Smoke/Lumine.Filesystem.Smoke.csproj -c Release --no-build

      - name: Generate filesystem sync benchmark
        run: dotnet run --project tools/Lumine.Filesystem.Benchmarks/Lumine.Filesystem.Benchmarks.csproj -c Release --no-build -- --count 128 --output artifacts/benchmarks/filesystem-sync.json

      - name: Enforce filesystem performance acceptance
        shell: pwsh
        run: ./build/Test-FilesystemPerformance.ps1

      - name: Generate Detail full-resolution benchmark
        run: dotnet run --project tools/Lumine.Detail.Benchmarks/Lumine.Detail.Benchmarks.csproj -c Release --no-build -- --output artifacts/benchmarks/detail-full-resolution.json

      - name: Enforce Detail full-resolution performance acceptance
        shell: pwsh
        run: ./build/Test-DetailPerformance.ps1

      - name: Generate full-resolution access-policy benchmark
        run: dotnet run --project tools/Lumine.FullResolution.Benchmarks/Lumine.FullResolution.Benchmarks.csproj -c Release --no-build -- --output artifacts/benchmarks/full-resolution-access-policy.json

      - name: Enforce full-resolution access-policy benchmark
        shell: pwsh
        run: ./build/Test-FullResolutionAccessPolicy.ps1

      - name: Viewer virtualization smoke test
        run: dotnet run --project tests/Lumine.Viewer.Smoke/Lumine.Viewer.Smoke.csproj -c Release --no-build

      - name: Generate Viewer Core benchmarks
        shell: pwsh
        run: |
          foreach ($count in 10000, 50000, 100000) {
            dotnet run --project tools/Lumine.Viewer.Benchmarks/Lumine.Viewer.Benchmarks.csproj -c Release --no-build -- --count $count --output "artifacts/benchmarks/viewer-$count.json"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Enforce Viewer performance acceptance
        shell: pwsh
        run: ./build/Test-ViewerPerformance.ps1 -ExpectedPrefetchRows 1

      # The original suite intentionally uses one lookahead row.
      # The product default is two; verify this separate path with the
      # same full acceptance limits rather than a synthetic speed claim.
      - name: Generate Viewer default two-row benchmarks
        shell: pwsh
        run: |
          foreach ($count in 10000, 50000, 100000) {
            dotnet run --project tools/Lumine.Viewer.Benchmarks/Lumine.Viewer.Benchmarks.csproj -c Release --no-build -- --count $count --prefetch-rows 2 --output "artifacts/benchmarks/viewer-prefetch2/viewer-$count.json"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Enforce Viewer default two-row performance acceptance
        shell: pwsh
        run: ./build/Test-ViewerPerformance.ps1 -BenchmarkDirectory "artifacts/benchmarks/viewer-prefetch2" -ExpectedPrefetchRows 2

      # Bounded UI realization experiment: same two-row source prefetch,
      # normal Avalonia panel vs native 0.25 overscan with offscreen I/O
      # deferred until viewport intersection. No production option changes.
      - name: Generate deferred-overscan Viewer A/B trial
        shell: pwsh
        run: |
          foreach ($count in 10000, 50000, 100000) {
            dotnet run --project tools/Lumine.Viewer.Benchmarks/Lumine.Viewer.Benchmarks.csproj -c Release --no-build -- --count $count --prefetch-rows 2 --realization-buffer 0.25 --defer-overscan-loads --output "artifacts/benchmarks/viewer-deferred-overscan/viewer-$count.json"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Compare Viewer deferred-overscan A/B readiness
        shell: pwsh
        run: |
          foreach ($count in 10000, 50000, 100000) {
            $control = Get-Content "artifacts/benchmarks/viewer-prefetch2/viewer-$count.json" -Raw | ConvertFrom-Json
            $trial = Get-Content "artifacts/benchmarks/viewer-deferred-overscan/viewer-$count.json" -Raw | ConvertFrom-Json
            if ([int]$control.metadata.prefetch_rows -ne 2 -or
                [int]$trial.metadata.prefetch_rows -ne 2 -or
                [double]$control.metadata.realization_buffer_factor -ne 0 -or
                [double]$trial.metadata.realization_buffer_factor -ne 0.25 -or
                $trial.metadata.defer_overscan_loads -ne "True") {
              throw "Viewer deferred-overscan A/B mismatched the control for $count."
            }
            Write-Host (
              "{0}: UI first-frame missing control/trial={1}/{2}; descriptor absent={3}/{4}; requests={5}/{6}; realized rows={7}/{8}; attached tiles={9}/{10}; decoded cache={11}/{12}" -f
              $count,
              $control.metadata.small_scroll_settled_forward_missing_on_first_frame,
              $trial.metadata.small_scroll_settled_forward_missing_on_first_frame,
              $control.metadata.small_scroll_settled_forward_no_descriptor,
              $trial.metadata.small_scroll_settled_forward_no_descriptor,
              $control.metadata.thumbnail_requests,
              $trial.metadata.thumbnail_requests,
              $control.metadata.max_realized_rows,
              $trial.metadata.max_realized_rows,
              $control.metadata.max_attached_tiles,
              $trial.metadata.max_attached_tiles,
              $control.metadata.max_decoded_bitmap_bytes,
              $trial.metadata.max_decoded_bitmap_bytes)
          }

      - name: Enforce strict deferred-overscan Viewer acceptance
        shell: pwsh
        run: ./build/Test-ViewerPerformance.ps1 -BenchmarkDirectory "artifacts/benchmarks/viewer-deferred-overscan" -ExpectedPrefetchRows 2 -ExpectedRealizationBuffer 0.25 -ExpectedDeferOverscanLoads $true

      - name: Compare Viewer one-row versus default two-row readiness
        shell: pwsh
        run: |
          foreach ($count in 10000, 50000, 100000) {
            $one = Get-Content "artifacts/benchmarks/viewer-$count.json" -Raw | ConvertFrom-Json
            $two = Get-Content "artifacts/benchmarks/viewer-prefetch2/viewer-$count.json" -Raw | ConvertFrom-Json
            if ([int]$one.metadata.prefetch_rows -ne 1 -or [int]$two.metadata.prefetch_rows -ne 2) {
              throw "Viewer lookahead depth comparison received mismatched fixtures for $count assets."
            }
            $oneMiss = [int]$one.metadata.small_scroll_settled_forward_missing_on_first_frame
            $twoMiss = [int]$two.metadata.small_scroll_settled_forward_missing_on_first_frame
            $oneWarm = [long]$one.metadata.small_scroll_settled_forward_warm_bitmap_hits
            $twoWarm = [long]$two.metadata.small_scroll_settled_forward_warm_bitmap_hits
            Write-Host (
              "{0:N0}: settled forward first-frame missing: 1-row={1}, 2-row={2}, delta={3:+#;-#;0}; warmed Bitmap hits: 1-row={4}, 2-row={5}, delta={6:+#;-#;0}" -f
              $count, $oneMiss, $twoMiss, ($twoMiss - $oneMiss),
              $oneWarm, $twoWarm, ($twoWarm - $oneWarm))
          }

      # Actual in-memory Skia raster evidence, distinct from a tile
      # Image.Source/IsReady counter and from real GPU display present.
      # This is an EXTRA, opt-in 10k run; capturing the frame may affect
      # timing, so do not feed it into performance acceptance.
      - name: Capture Skia-rendered first-scroll frame
        shell: pwsh
        run: |
          dotnet run --project tools/Lumine.Viewer.Benchmarks/Lumine.Viewer.Benchmarks.csproj -c Release --no-build -- --count 10000 --prefetch-rows 2 --output "artifacts/viewer-rendered/diagnostic-10000.json" --frame-output "artifacts/viewer-rendered/settled-first-offset-10000.png"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Skia-rendered Viewer scroll evidence
        uses: actions/upload-artifact@v7
        with:
          name: lumine-viewer-skia-frame-${{ github.run_id }}
          path: |
            artifacts/viewer-rendered/*.png
            artifacts/viewer-rendered/*.json
          if-no-files-found: error

      - name: Generate 100k Core baseline result
        run: dotnet run --project tools/Lumine.Benchmarks/Lumine.Benchmarks.csproj -c Release --no-build -- --count 100000 --output artifacts/benchmarks/core-100000.json

      - name: Generate Library Core benchmarks
        shell: pwsh
        run: |
          # Keep a cold 100k sample so the acceptance gate cannot be satisfied
          # only because smaller runs warmed SQLite / filesystem caches first.
          dotnet run --project tools/Lumine.Library.Benchmarks/Lumine.Library.Benchmarks.csproj -c Release --no-build -- --count 100000 --output "artifacts/benchmarks/library-100000-cold.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          foreach ($count in 10000, 50000, 100000) {
            dotnet run --project tools/Lumine.Library.Benchmarks/Lumine.Library.Benchmarks.csproj -c Release --no-build -- --count $count --output "artifacts/benchmarks/library-$count.json"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Enforce Library performance acceptance
        shell: pwsh
        run: ./build/Test-LibraryPerformance.ps1

      - name: Generate Image Core benchmark
        run: dotnet run --project tools/Lumine.Image.Benchmarks/Lumine.Image.Benchmarks.csproj -c Release --no-build -- --count 64 --output artifacts/benchmarks/image-thumbnail.json

      - name: Enforce Image performance acceptance
        shell: pwsh
        run: ./build/Test-ImagePerformance.ps1

      - name: Generate BMP fallback benchmark
        run: dotnet run --project tools/Lumine.Bmp.Benchmarks/Lumine.Bmp.Benchmarks.csproj -c Release --no-build -- --output artifacts/benchmarks/bmp-fallback.json

      - name: Enforce BMP fallback acceptance
        shell: pwsh
        run: ./build/Test-BmpFallback.ps1

      - name: Upload Core benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lumine-core-baselines-${{ github.run_id }}
          path: |
            artifacts/benchmarks/*.json
            artifacts/benchmarks/viewer-prefetch2/*.json
            artifacts/benchmarks/viewer-deferred-overscan/*.json
          if-no-files-found: error

      - name: Publish NativeAOT
        run: dotnet publish src/Lumine.App/Lumine.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/native-aot

      - name: Stamp NativeAOT acceptance revision
        shell: pwsh
        run: |
          Set-Content -LiteralPath "artifacts/native-aot/revision.txt" -Value $env:GITHUB_SHA -NoNewline -Encoding ascii

      - name: Prepare default-portable product package
        shell: pwsh
        run: |
          $flag = Join-Path $PWD "artifacts/native-aot/portable.flag"
          New-Item -ItemType File -Force -Path $flag | Out-Null
          if (-not (Test-Path -LiteralPath $flag -PathType Leaf)) {
            throw "Portable package marker was not created: $flag"
          }

      - name: Verify NativeAOT executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/native-aot/Lumine.App.exe"
          if (-not (Test-Path $exe)) {
            throw "NativeAOT executable was not produced: $exe"
          }
          $item = Get-Item $exe
          Write-Host "NativeAOT executable: $($item.FullName) ($($item.Length) bytes)"

      - name: Run NativeAOT product runtime lifecycle smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/native-aot/Lumine.App.exe"
          $root = Join-Path $env:RUNNER_TEMP "lumine-product-runtime-$env:GITHUB_RUN_ID"
          $data = Join-Path $root "data"
          $library = Join-Path $root "library"

          New-Item -ItemType Directory -Force -Path $data | Out-Null
          New-Item -ItemType Directory -Force -Path $library | Out-Null

          foreach ($launch in 1..3) {
            Write-Host "NativeAOT lifecycle launch $launch"
            & $exe --product-smoke "--data-dir=$data" "--library-dir=$library"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $marker = Join-Path $data "runtime.unclean"
            if (Test-Path $marker) {
              throw "Clean product smoke left recovery marker after launch $launch."
            }

            $wal = Join-Path $data "library.db-wal"
            if ((Test-Path $wal) -and ((Get-Item $wal).Length -ne 0)) {
              throw "Clean product smoke left a non-empty SQLite WAL after launch $launch."
            }
          }

      - name: Verify NativeAOT package is portable by default
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "artifacts/native-aot"
          $exe = Join-Path $publish "Lumine.App.exe"
          $flag = Join-Path $publish "portable.flag"
          $portableData = Join-Path $publish "data"
          $library = Join-Path $env:RUNNER_TEMP "lumine-packaged-portable-library-$env:GITHUB_RUN_ID"

          if (-not (Test-Path -LiteralPath $flag -PathType Leaf)) {
            throw "Packaged product is missing portable.flag."
          }

          if (Test-Path -LiteralPath $portableData) {
            Remove-Item -LiteralPath $portableData -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $library | Out-Null

          try {
            & $exe --product-smoke "--library-dir=$library"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $database = Join-Path $portableData "library.db"
            if (-not (Test-Path -LiteralPath $database -PathType Leaf)) {
              throw "Default packaged launch did not create its database under <exe>\data."
            }

            $marker = Join-Path $portableData "runtime.unclean"
            if (Test-Path -LiteralPath $marker) {
              throw "Default packaged portable smoke left an unclean-shutdown marker."
            }

            $wal = "$database-wal"
            if ((Test-Path -LiteralPath $wal) -and ((Get-Item -LiteralPath $wal).Length -ne 0)) {
              throw "Default packaged portable smoke left a non-empty SQLite WAL."
            }
          }
          finally {
            if (Test-Path -LiteralPath $portableData) {
              Remove-Item -LiteralPath $portableData -Recurse -Force
            }
          }

      - name: Run real-library acceptance wrapper smoke on Windows PowerShell 5.1
        id: acceptance-default
        continue-on-error: true
        shell: powershell
        run: ./build/Test-RealLibraryAcceptanceWrapper.ps1 -NativeAotDirectory "./artifacts/native-aot" -ExpectedRevision $env:GITHUB_SHA -Repeat 10 -Win32CompositionMode Default -Win32RenderingMode Default

      - name: Run RedirectionSurface acceptance diagnostic smoke
        id: acceptance-redirection
        continue-on-error: true
        shell: powershell
        run: ./build/Test-RealLibraryAcceptanceWrapper.ps1 -NativeAotDirectory "./artifacts/native-aot" -ExpectedRevision $env:GITHUB_SHA -Repeat 1 -Win32CompositionMode RedirectionSurface -Win32RenderingMode Default

      - name: Run software-renderer acceptance diagnostic smoke
        id: acceptance-software
        continue-on-error: true
        shell: powershell
        run: ./build/Test-RealLibraryAcceptanceWrapper.ps1 -NativeAotDirectory "./artifacts/native-aot" -ExpectedRevision $env:GITHUB_SHA -Repeat 1 -Win32CompositionMode Default -Win32RenderingMode Software

      - name: Report acceptance backend diagnostics
        shell: powershell
        env:
          DEFAULT_RESULT: ${{ steps.acceptance-default.outcome }}
          REDIRECTION_RESULT: ${{ steps.acceptance-redirection.outcome }}
          SOFTWARE_RESULT: ${{ steps.acceptance-software.outcome }}
        run: |
          Write-Host "Default             : $env:DEFAULT_RESULT"
          Write-Host "RedirectionSurface  : $env:REDIRECTION_RESULT"
          Write-Host "Software renderer   : $env:SOFTWARE_RESULT"

          if ($env:DEFAULT_RESULT -ne "success") {
            throw "Default NativeAOT acceptance path failed; A/B outcomes are printed above."
          }

      # Acceptance probes execute the distributable tree; restore a first-run-clean package before upload.
      - name: Sanitize NativeAOT acceptance package
        shell: pwsh
        run: ./build/Sanitize-AcceptancePackage.ps1 -NativeAotDirectory "./artifacts/native-aot" -ExpectedRevision $env:GITHUB_SHA

      - name: Upload NativeAOT Core acceptance build
        uses: actions/upload-artifact@v7
        with:
          name: lumine-core-acceptance-win-x64-${{ github.run_id }}
          path: |
            artifacts/native-aot/**
            build/Run-RealLibraryAcceptance.ps1
            build/Compare-ThumbnailStoragePolicies.ps1
            docs/core-acceptance.md
          if-no-files-found: error

      - name: Upload NativeAOT Product acceptance build
        uses: actions/upload-artifact@v7
        with:
          name: lumine-product-acceptance-win-x64-${{ github.run_id }}
          path: |
            artifacts/native-aot/**
            build/Run-ProductAcceptance.ps1
            build/Run-RealLibraryAcceptance.ps1
            docs/product-acceptance.md
            docs/core-acceptance.md
            docs/product-settings-portable.md
          if-no-files-found: error

      - name: Publish NativeAOT Image runtime smoke
        run: dotnet publish tests/Lumine.Image.NativeAot.Smoke/Lumine.Image.NativeAot.Smoke.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/native-aot-image-smoke

      - name: Run NativeAOT Image runtime smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/native-aot-image-smoke/Lumine.Image.NativeAot.Smoke.exe"
          if (-not (Test-Path $exe)) {
            throw "NativeAOT Image smoke executable was not produced: $exe"
          }

          # Fresh process 1: prove Lumine follows a non-default libvips threshold.
          $env:VIPS_DISC_THRESHOLD = "67108864"
          $env:LUMINE_EXPECT_DISC_THRESHOLD_BYTES = "67108864"
          foreach ($launch in 1..3) {
            Write-Host "NativeAOT Image shutdown launch A/$launch"
            & $exe
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          # Fresh processes 4-6: prove the production comparison is strictly '>'
          # rather than '>=' when decoded bytes exactly equal the threshold.
          $env:VIPS_DISC_THRESHOLD = "84934656"
          $env:LUMINE_EXPECT_DISC_THRESHOLD_BYTES = "84934656"
          foreach ($launch in 1..3) {
            Write-Host "NativeAOT Image shutdown launch B/$launch"
            & $exe
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
