name: build-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    tags:
      - "v*"
    branches: [release]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Build Windows app
        run: wails build -platform windows/amd64
        env:
          CGO_ENABLED: "0"

      - name: Build Windows portable
        run: wails build -platform windows/amd64 -ldflags "-H windowsgui" -o Lumine-portable.exe
        env:
          CGO_ENABLED: "0"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumine-windows
          path: build/bin/Lumine.exe

      - name: Package portable version
        shell: pwsh
        run: Compress-Archive -Path build/bin/Lumine-portable.exe -DestinationPath build/bin/Lumine-portable.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumine-windows-portable
          path: build/bin/Lumine-portable.zip

      - name: Upload full bundle
        uses: actions/upload-artifact@v4
        with:
          name: lumine-windows-bundle
          path: build/bin/*
