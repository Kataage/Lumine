name: build-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    tags:
      - "v*"
    branches: [release]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Inspect pinned DirectML NuGet artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "lumine-directml-inspect"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $ortUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.29.0/microsoft.ml.onnxruntime.directml.1.29.0.nupkg"
          $ortFile = Join-Path $root "Microsoft.ML.OnnxRuntime.DirectML.1.29.0.nupkg"
          Invoke-WebRequest -Uri $ortUrl -OutFile $ortFile
          $ortHash = (Get-FileHash -Algorithm SHA256 $ortFile).Hash.ToLowerInvariant()
          $ortSize = (Get-Item $ortFile).Length
          Write-Host ("PACKAGE Microsoft.ML.OnnxRuntime.DirectML 1.29.0 size={0} sha256={1}" -f $ortSize, $ortHash)
          $ortExtract = Join-Path $root "ort"
          [System.IO.Compression.ZipFile]::ExtractToDirectory($ortFile, $ortExtract)
          $ortNative = Join-Path $ortExtract "runtimes\win-x64\native"
          if (-not (Test-Path $ortNative)) { throw "DirectML ORT x64 native folder missing" }
          foreach ($item in Get-ChildItem -Path $ortNative -File) {
            $itemHash = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLowerInvariant()
            Write-Host ("ORTFILE {0} size={1} sha256={2}" -f $item.Name, $item.Length, $itemHash)
          }

          $dmlUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg"
          $dmlFile = Join-Path $root "Microsoft.AI.DirectML.1.15.4.nupkg"
          Invoke-WebRequest -Uri $dmlUrl -OutFile $dmlFile
          $dmlHash = (Get-FileHash -Algorithm SHA256 $dmlFile).Hash.ToLowerInvariant()
          $dmlSize = (Get-Item $dmlFile).Length
          Write-Host ("PACKAGE Microsoft.AI.DirectML 1.15.4 size={0} sha256={1}" -f $dmlSize, $dmlHash)
          $dmlExtract = Join-Path $root "directml"
          [System.IO.Compression.ZipFile]::ExtractToDirectory($dmlFile, $dmlExtract)
          $dmlDlls = Get-ChildItem -Path $dmlExtract -Recurse -File -Filter "DirectML.dll"
          if ($dmlDlls.Count -eq 0) { throw "DirectML.dll missing from Microsoft.AI.DirectML package" }
          foreach ($item in $dmlDlls) {
            $relative = [System.IO.Path]::GetRelativePath($dmlExtract, $item.FullName)
            $itemHash = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLowerInvariant()
            Write-Host ("DMLFILE {0} size={1} sha256={2}" -f $relative, $item.Length, $itemHash)
          }

      - name: Prepare frontend embed directory
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Verify AI bindings
        shell: bash
        run: |
          grep -q "GetAISettings" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "PatchAISettings" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "GetAIHealthSnapshot" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "EnsureSemanticSearchReady" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "SemanticSearchAssetsWithID" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "GetSemanticIndexStatus" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "RequestLegacyStorageMigration" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "CancelLegacyStorageMigration" frontend/wailsjs/go/commands/AppCommands.js
          if grep -q "ConfigureStorageLayout" frontend/wailsjs/go/commands/AppCommands.js; then
            echo "internal ConfigureStorageLayout leaked into Wails bindings" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Shutdown sidecar smoke
        run: go test ./internal/ai -run TestSidecarStopTerminatesRunningProcess -count=1 -v

      - name: Storage resolver tests
        run: go test ./internal/infrastructure/storage -count=1 -v

      - name: Distribution mode smoke
        run: |
          go test . -run TestDistributionModeInstalled -count=1
          go test -tags portable . -run TestDistributionModePortable -count=1

      - name: Build Windows app
        run: wails build -platform windows/amd64
        env:
          CGO_ENABLED: "0"

      - name: Build Windows portable
        run: wails build -platform windows/amd64 -tags portable -ldflags "-H windowsgui" -o Lumine-portable.exe
        env:
          CGO_ENABLED: "0"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumine-windows
          path: build/bin/Lumine.exe
          if-no-files-found: error

      # upload-artifact itself produces the single downloadable ZIP wrapper.
      # Upload the portable EXE directly so users do not get ZIP-inside-ZIP.
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumine-windows-portable
          path: build/bin/Lumine-portable.exe
          if-no-files-found: error

      - name: Upload full bundle
        uses: actions/upload-artifact@v4
        with:
          name: lumine-windows-bundle
          path: build/bin/*
          if-no-files-found: error
