name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint src --max-warnings 0

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Create frontend/dist for embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Go mod tidy
        run: go mod tidy

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -v ./...

      - name: Go test
        run: go test -v -race ./...

      - name: Semantic search perf smoke
        run: go test ./internal/commands -run '^      - name: Validate AI benchmark Python tooling
        run: python3 -m py_compile benchmarks/ai/adapters/tagger_onnx.py benchmarks/ai/adapters/tagger_report.py benchmarks/ai/adapters/vision_common.py benchmarks/ai/adapters/lightvision_florence.py benchmarks/ai/adapters/lightvision_smolvlm.py benchmarks/ai/adapters/lightvision_report.py benchmarks/ai/adapters/advancedvision_common.py benchmarks/ai/adapters/advancedvision_llamacpp.py benchmarks/ai/adapters/advancedvision_report.py benchmarks/ai/adapters/prompt_common.py benchmarks/ai/adapters/prompt_llamacpp.py benchmarks/ai/adapters/prompt_report.py
 -bench '^BenchmarkSemanticMemoryIndexSearch20K      - name: Validate AI benchmark Python tooling
        run: python3 -m py_compile benchmarks/ai/adapters/tagger_onnx.py benchmarks/ai/adapters/tagger_report.py benchmarks/ai/adapters/vision_common.py benchmarks/ai/adapters/lightvision_florence.py benchmarks/ai/adapters/lightvision_smolvlm.py benchmarks/ai/adapters/lightvision_report.py benchmarks/ai/adapters/advancedvision_common.py benchmarks/ai/adapters/advancedvision_llamacpp.py benchmarks/ai/adapters/advancedvision_report.py benchmarks/ai/adapters/prompt_common.py benchmarks/ai/adapters/prompt_llamacpp.py benchmarks/ai/adapters/prompt_report.py
