name: ci

permissions:
  contents: write

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go for Wails bindings
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Prepare frontend embed directory
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Verify AI bindings
        run: |
          grep -q "GetAISettings" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "PatchAISettings" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "GetAIHealthSnapshot" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "EnsureSemanticSearchReady" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "SemanticSearchAssetsWithID" frontend/wailsjs/go/commands/AppCommands.js
          grep -q "GetSemanticIndexStatus" frontend/wailsjs/go/commands/AppCommands.js

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Upload generated Wails bindings
        uses: actions/upload-artifact@v4
        with:
          name: wails-bindings
          path: |
            frontend/wailsjs/go/commands/AppCommands.js
            frontend/wailsjs/go/commands/AppCommands.d.ts
            frontend/wailsjs/go/models.ts
          if-no-files-found: error

      - name: Sync generated Wails bindings on audit branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ai-audit-correctness'
        shell: bash
        run: |
          if git diff --quiet -- frontend/wailsjs; then
            exit 0
          fi
          tmpdir="$(mktemp -d)"
          cp frontend/wailsjs/go/commands/AppCommands.js "$tmpdir/AppCommands.js"
          cp frontend/wailsjs/go/commands/AppCommands.d.ts "$tmpdir/AppCommands.d.ts"
          cp frontend/wailsjs/go/models.ts "$tmpdir/models.ts"
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp "$tmpdir/AppCommands.js" frontend/wailsjs/go/commands/AppCommands.js
          cp "$tmpdir/AppCommands.d.ts" frontend/wailsjs/go/commands/AppCommands.d.ts
          cp "$tmpdir/models.ts" frontend/wailsjs/go/models.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/wailsjs
          git commit -m "chore(wails): sync generated bindings"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint src --max-warnings 0

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Create frontend/dist for embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Go mod tidy
        run: go mod tidy

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -v ./...

      - name: Go test
        run: go test -v -race ./...

      - name: Semantic search perf smoke
        run: go test ./internal/commands -run=^NO_TESTS$ -bench=^BenchmarkSemanticMemoryIndexSearch20K$ -benchtime=1x -benchmem

      - name: Validate AI benchmark Python tooling
        run: python3 -m py_compile benchmarks/ai/adapters/tagger_onnx.py benchmarks/ai/adapters/tagger_report.py benchmarks/ai/adapters/vision_common.py benchmarks/ai/adapters/lightvision_florence.py benchmarks/ai/adapters/lightvision_smolvlm.py benchmarks/ai/adapters/lightvision_report.py benchmarks/ai/adapters/advancedvision_common.py benchmarks/ai/adapters/advancedvision_llamacpp.py benchmarks/ai/adapters/advancedvision_report.py benchmarks/ai/adapters/prompt_common.py benchmarks/ai/adapters/prompt_llamacpp.py benchmarks/ai/adapters/prompt_report.py
